apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  # Pinned embedding model across indexer and API (section 4.4)
  EMBED_MODEL: "nomic-embed-text"
  RETRIEVER: "chroma"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  HOSTED_BASE_URL: ""
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  TOP_K: "5"
  TEMPERATURE: "0.2"
  RELEVANCE_FLOOR: "0.35"
  CACHE_THRESHOLD: "0.90"
  ENABLE_CACHE: "true"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  CORPUS_DIR: "/corpus"
  LOG_LEVEL: "INFO"
