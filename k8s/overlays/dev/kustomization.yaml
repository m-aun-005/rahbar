apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

resources:
  - ../../base

namePrefix: dev-

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/LLM_PROVIDER
        value: stub
      - op: replace
        path: /data/CORPUS_DIR
        value: /fixtures
      - op: replace
        path: /data/RELEVANCE_FLOOR
        value: "0.20"
