apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

resources:
  - ../../base

namePrefix: dev-

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/LLM_PROVIDER
        value: ollama-host
      - op: replace
        path: /data/CORPUS_DIR
        value: /fixtures
      - op: replace
        path: /data/CHROMA_HOST
        value: dev-chroma
      - op: replace
        path: /data/REDIS_HOST
        value: dev-redis
      - op: replace
        path: /data/OLLAMA_URL
        value: http://host.docker.internal:11434
      - op: replace
        path: /data/RELEVANCE_FLOOR
        value: "0.20"
  - target:
      kind: HorizontalPodAutoscaler
      name: api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
